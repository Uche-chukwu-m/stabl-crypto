# Lets the same Solidity tests run under Arc Foundry, Arc's own fork of Foundry:
#   arc-forge test --network arc
# Hardhat is what CI and `npm test` use; see hardhat.config.ts.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
remappings = ["forge-std/=node_modules/forge-std/src/"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
